packages:
  - "packages/*"
allowBuilds:
  '@alicloud/openapi-core': set this to true or false
  '@scarf/scarf': set this to true or false
  bcrypt: set this to true or false
  cpu-features: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  ssh2: set this to true or false
  tos-crc64-js: set this to true or false
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - '@dofe/infra-clients@0.1.86'
  - '@dofe/infra-common@0.1.86'
  - '@dofe/infra-contracts-base@0.1.86'
  - '@dofe/infra-contracts@0.1.86'
  - '@dofe/infra-docker@0.1.86'
  - '@dofe/infra-i18n@0.1.86'
  - '@dofe/infra-jwt@0.1.86'
  - '@dofe/infra-prisma@0.1.86'
  - '@dofe/infra-rabbitmq@0.1.86'
  - '@dofe/infra-redis@0.1.86'
  - '@dofe/infra-shared-db@0.1.86'
  - '@dofe/infra-utils@0.1.86'
