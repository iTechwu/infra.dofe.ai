packages:
  - "packages/*"
peerDependencyRules:
  allowedVersions:
    '@dofe/*': "*"
    bcrypt: ">=5.1.0"
    dotenv: ">=16.0.0"
    eslint: "10"
  missingPeersAllowed:
    '@dofe/infra-contracts': true
    '@dofe/infra-common': true
    '@dofe/infra-utils': true
    '@dofe/infra-redis': true
    '@dofe/infra-prisma': true
    '@dofe/infra-jwt': true
    '@dofe/infra-i18n': true
    '@dofe/infra-clients': true
    '@dofe/infra-rabbitmq': true
    '@dofe/infra-shared-db': true
    '@dofe/infra-shared-services': true
onlyBuiltDependencies:
  - '@nestjs/core'
allowBuilds:
  '@alicloud/openapi-core': true
  '@scarf/scarf': false
  bcrypt: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  tos-crc64-js: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@dofe/infra-clients@0.1.86'
  - '@dofe/infra-common@0.1.86'
  - '@dofe/infra-contracts-base@0.1.86'
  - '@dofe/infra-contracts@0.1.86'
  - '@dofe/infra-docker@0.1.86'
  - '@dofe/infra-i18n@0.1.86'
  - '@dofe/infra-jwt@0.1.86'
  - '@dofe/infra-prisma@0.1.86'
  - '@dofe/infra-rabbitmq@0.1.86'
  - '@dofe/infra-redis@0.1.86'
  - '@dofe/infra-shared-db@0.1.86'
  - '@dofe/infra-utils@0.1.86'
